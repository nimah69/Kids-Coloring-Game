<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff0f7">
<meta name="description" content="پری و دنیای جادویی؛ هشت بازی آموزشی مهربانانه برای کودکان ۳ تا ۷ سال.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self';">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/style.css">
<title>پری و دنیای جادویی 🧚</title>
</head>
<body>
<header class="topbar">
  <button id="homeBtn" class="icon-btn" aria-label="بازگشت به خانه">🏠</button>
  <div class="fairy-avatar" aria-hidden="true" id="fairy">🌱</div>
  <div class="growth"><strong id="stageName">جوانه‌ی پری</strong><div class="starline">⭐ <b id="starCount">۰</b></div><progress id="growthBar" value="0" max="4" aria-label="پیشرفت پری"></progress></div>
  <button id="soundBtn" class="icon-btn" aria-label="روشن یا خاموش کردن صدا">🔊</button>
</header>
<div id="bubble" class="bubble" role="status" aria-live="polite">سلام دوست کوچولو! بیا با هم بازی کنیم ✨</div>
<main id="app" class="main"></main>
<footer>ساخته‌شده با مهربانی 💖 · همه‌ی اطلاعات فقط روی همین دستگاه ذخیره می‌شود.</footer>
<script type="module" src="./js/app.js"></script>
</body>
</html>
