name: Test Peri game
on:
  push:
    paths:
      - 'peri/**'
      - '.github/workflows/peri-test.yml'
  pull_request:
    paths:
      - 'peri/**'
      - '.github/workflows/peri-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node peri/tests/quality-check.mjs
